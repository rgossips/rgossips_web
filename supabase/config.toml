# Supabase CLI config.
#
# WHY THIS FILE EXISTS. Without it every `functions deploy` used the CLI
# default (verify_jwt = true), so redeploying a PUBLIC function silently
# re-gated it behind JWT auth and the app — which calls edge functions with the
# publishable key, not a JWT — started getting {"error":"Authentication Error"}.
# The workaround was to remember `--no-verify-jwt` on every deploy, which is
# exactly the kind of thing that gets forgotten.
#
# It also fixes the opposite failure, which is worse: the flag is STICKY and
# one-way. `--no-verify-jwt` turns the gate off and there is no
# `--verify-jwt` to turn it back on — a multi-function deploy that includes
# the flag strips the gate from every function in the list, permanently, from
# the CLI's point of view. That is how escrow-release lost its gate while its
# sibling escrow-fund kept one.
#
# The values below were generated from the LIVE deployed state, so declaring
# them changes nothing on its own. Keep them true. If you make a function
# public, flip it here rather than passing a flag.
project_id = "hlfevcdtbehukxrrgykv"

[functions.admin-escrow-resolve]
verify_jwt = true

[functions.ai-generate]
verify_jwt = false

